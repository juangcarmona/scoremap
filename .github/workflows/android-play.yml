name: Android Google Play
on:
  push:
    branches: [main, feat/google-play-release]
    paths: ['src/android/**', 'scripts/google-play-preflight.mjs', '.github/workflows/android-play.yml']
  workflow_dispatch:
    inputs:
      package_name:
        description: Permanent package name registered in Play Console
        required: true
        default: com.jgcarmona.scoremap
        type: string
      publish:
        description: Upload a draft release to internal testing (requires first Console upload)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-google-play
  cancel-in-progress: false
jobs:
  bundle:
    name: Signed Android App Bundle
    if: github.repository_id == '1458674261'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SCOREMAP_APPLICATION_ID: ${{ inputs.package_name || 'com.jgcarmona.scoremap' }}
      SCOREMAP_VERSION_CODE: ${{ github.run_number }}
      SCOREMAP_VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Restore Android toolchain cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/scoremap-android-host/sdk
            .runtime/android-ci/host
          key: android-host-${{ hashFiles('scripts/android-ci-toolchain-pins.json', 'src/android/**/gradle.lockfile', 'src/android/gradle/verification-metadata.xml', 'src/android/gradle/wrapper/gradle-wrapper.properties', 'src/android/gradle/libs.versions.toml') }}
          restore-keys: |
            android-host-
      - name: Provision pinned Android toolchain
        run: node scripts/android-ci-toolchain.mjs install host
      - name: Restore upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/scoremap-upload.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/scoremap-upload.p12" >> "$GITHUB_ENV"
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: src/android
        run: ./gradlew :app:bundleRelease --no-configuration-cache
      - name: Verify bundle signature and record provenance
        run: |
          set -euo pipefail
          bundle=src/android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle" > "$RUNNER_TEMP/bundle-signature.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/bundle-signature.txt"
          sha256sum "$bundle" > "$bundle.sha256"
          printf 'Source: %s\nPackage: %s\nVersion code: %s\nVersion: %s\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SHA" "$SCOREMAP_APPLICATION_ID" "$SCOREMAP_VERSION_CODE" "$SCOREMAP_VERSION_NAME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > src/android/app/build/outputs/bundle/release/provenance.txt
      - name: Retain signed bundle for first Console upload
        uses: actions/upload-artifact@v4
        with:
          name: scoremap-play-${{ github.run_number }}
          path: src/android/app/build/outputs/bundle/release/
          if-no-files-found: error
          retention-days: 30
      - name: Check Google authentication and app access
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/google-play-preflight.mjs
      - name: Upload draft to internal testing
        if: inputs.publish && github.ref == 'refs/heads/main'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.SCOREMAP_APPLICATION_ID }}
          releaseFiles: src/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: draft
      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/scoremap-upload.p12"
