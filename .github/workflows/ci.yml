name: ScoreMap CI
on:
  push:
    branches: [main, 'lighthouse/verification-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify ScoreMap
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npx --yes --package=npm@10.9.4 -- npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Connected private-library qualification
        shell: bash
        run: |
          npm run build:private
          setsid npm run dev:private -- config/application.example.json config/development-users.example.json > "$RUNNER_TEMP/scoremap-connected.log" 2>&1 &
          scoremap_bootstrap_group=$!
          trap 'kill -- -"$scoremap_bootstrap_group" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:5280/health/ready >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:5280/health/ready >/dev/null
          npm run test:connected
      - run: npm run verify:delivery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoremap-verification
          path: |
            docs/evidence/
            test-results/
            playwright-report/
          retention-days: 30
