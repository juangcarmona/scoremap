name: ScoreMap CI
on:
  push:
    branches: [main, 'lighthouse/verification-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify ScoreMap
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run verify:delivery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoremap-verification
          path: |
            docs/evidence/
            test-results/
            playwright-report/
          retention-days: 30
