name: scoremap
services:
  application:
    image: ${SCOREMAP_IMAGE:?Select a built, reviewed ScoreMap image by digest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SCOREMAP_APPLICATION_FILE: /run/scoremap/application.json
    ports:
      - "127.0.0.1:${SCOREMAP_HTTP_PORT:-5280}:8080"
    volumes:
      - ${SCOREMAP_APPLICATION_FILE:?Select private Production configuration}:/run/scoremap/application.json:ro
      - session-keys:/var/lib/scoremap/keys
    depends_on:
      database:
        condition: service_healthy
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  database:
    image: postgres:18.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: scoremap
      POSTGRES_DB: scoremap
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - database:/var/lib/postgresql
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U scoremap -d scoremap"]
      interval: 10s
      timeout: 5s
      retries: 10
secrets:
  database_password:
    file: ${SCOREMAP_DATABASE_PASSWORD_FILE:?Select private database-password file}
networks:
  private:
volumes:
  database:
  session-keys:
