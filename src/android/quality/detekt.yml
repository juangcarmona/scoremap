config:
  validation: true

style:
  ForbiddenComment:
    active: true
    comments:
      - 'TODO:'
      - 'FIXME:'
      - 'STOPSHIP:'

coroutines:
  GlobalCoroutineUsage:
    active: true
  SleepInsteadOfDelay:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
